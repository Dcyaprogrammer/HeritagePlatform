spring.application.name=platform

# Server Port
server.port=8080

# ===============================
# MySQL Database Configuration
# ===============================
# Adding createDatabaseIfNotExist=true so Spring Boot can create the DB automatically
spring.datasource.url=jdbc:mysql://localhost:3306/heritage_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
# validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# Database Initialization
# ===============================
# Executes schema.sql on startup
spring.sql.init.mode=always