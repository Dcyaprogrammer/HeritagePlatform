spring.application.name=platform

# Server Port
server.port=8080

# ===============================
# MySQL Database Configuration
# ===============================
# Sensitive data moved to application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/heritage_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# JWT Configuration
# ===============================
jwt.secret=HeritagePlatform2026SecretKeyForJWTAtLeast32BytesLong!!!
jwt.expiration=86400000

# ===============================
# Database Initialization
# ===============================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# Profile Activation
# ===============================
# Activate local profile for sensitive configs (email, etc.)
spring.profiles.active=local

