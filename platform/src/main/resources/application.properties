spring.application.name=platform

# Server Port
server.port=8080

# ===============================
# MySQL Database Configuration
# ===============================
# Sensitive data moved to application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/heritage_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# JWT Configuration
# ===============================
jwt.secret=local_dev_secret_at_least_32_chars_for_heritage_platform
jwt.expiration=86400000

# ===============================
# Database Initialization
# ===============================
spring.sql.init.mode=never

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# Profile Activation
# ===============================
# Activate local profile for sensitive configs (email, etc.)
spring.profiles.active=local

# Mock Email Configuration to satisfy JavaMailSender bean
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=mock
spring.mail.password=mock
